# .github/workflows/vhdl_syntax_check.yml
name: VHDL Syntax Check

on:
  push:
    paths:
      - "Core"
      - "Memory"
      - "Peripherals"
      - "TopLevel"
      - "Makefile"
      - ".github/workflows/vhdl_syntax_check.yml"
  pull_request:
    paths:
      - "Core"
      - "Memory"
      - "Peripherals"
      - "TopLevel"
      - "Makefile"

jobs:
  ghdl-check:
    name: GHDL syntax check
    runs-on: ubuntu-26.04
    # the ci-vhdl image of insper-riscv/Infra: GHDL and uv on PATH.
    container:
      image: ghcr.io/insper-riscv/ci-vhdl:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Python dependencies (riscv-tools, from Tests/tools/Tools)
        run: uv sync --project Tests

      - name: VHDL syntax check (Makefile target)
        run: make check
